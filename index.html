<script>
/* Aplica tema, tamaño de letra y privacidad ANTES del primer pintado (evita el destello). */
(function () {
  try {
    var raw = localStorage.getItem('miscuentas.v1');
    var st = raw ? (JSON.parse(raw).settings || {}) : {};
    var d = document.documentElement;
    if (st.theme === 'light' || st.theme === 'dark') d.setAttribute('data-theme', st.theme);
    if (st.fontSize === 'grande' || st.fontSize === 'mas-grande') d.setAttribute('data-fontsize', st.fontSize);
    if (st.privacy) d.setAttribute('data-privacy', 'on');
  } catch (e) { /* sin almacenamiento: se ve con los valores por defecto */ }
})();
</script>
